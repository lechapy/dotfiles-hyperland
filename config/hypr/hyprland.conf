# --- Monitores y Configuración Base ---
source = ~/.config/hypr/monitors.hl
monitor=,preferred,auto,1

$mainMod = SUPER
$terminal = kitty
$fileManager = dolphin
$menu = rofi -show drun

# --- Teclado ---
input {
    kb_layout = latam
}

# --- Variables de Entorno (Temas y Estabilidad NVIDIA) ---
env = GTK_THEME,Adwaita:dark 
env = QT_QPA_PLATFORMTHEME,qt6ct
env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = WLR_NO_HARDWARE_CURSORS,1

# --- Estética, Visuales y Animaciones "Pro" ---
general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(8f00ffee) 45deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle
}

decoration {
    rounding = 10
    active_opacity = 0.95
    inactive_opacity = 0.85
    shadow {
        enabled = true
        range = 15
        render_power = 3
        color = rgba(1a1a1aee)
    }
}

animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

# --- Inicio Automático de Servicios ---
exec-once = waybar
#exec-once = hyprpaper
exec-once = linux-wallpaperengine --silent --screen-root eDP-1 3725142524
exec-once = hypridle
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = udiskie --tray
exec-once = swayosd-server
exec-once = batsignal -w 30 -c 10

# --- Atajos de Teclado Base ---
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu

# Historial del Portapapeles rápido (Rofi)
bind = $mainMod SHIFT, V, exec, cliphist list | rofi -dmenu -theme-str 'configuration {drun-display-format: "{name}";} window {width: 500px;}' | cliphist decode | wl-copy
# Mover el foco del mouse/ventana
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Mover ventanas de posición
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow , d 

# Moverse entre Espacios de Trabajo (Workspaces)
bind = $mainMod, h, workspace, 1
bind = $mainMod, j, workspace, 2
bind = $mainMod, k, workspace, 3
bind = $mainMod, l, workspace, 4

# Enviar ventana activa a un Espacio de Trabajo
bind = $mainMod SHIFT, h, movetoworkspace, 1
bind = $mainMod SHIFT, j, movetoworkspace, 2
bind = $mainMod SHIFT, k, movetoworkspace, 3
bind = $mainMod SHIFT, l, movetoworkspace, 4

# Capturas de pantalla (Hyprshot)
bind = , Print, exec, hyprshot -m output
bind = SHIFT, Print, exec, hyprshot -m region

# Apagado y Reinicio del Sistema
bind = SUPER SHIFT, O, exec, systemctl poweroff
bind = SUPER SHIFT, R, exec, systemctl reboot

# --- Controles de Reproducción y Multimedia ---
bindl = ,XF86AudioPlay, exec, playerctl play-pause
bindl = ,XF86AudioNext, exec, playerctl next
bindl = ,XF86AudioPrev, exec, playerctl previous

# --- Controles de Brillo de Pantalla ---
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 5%-

# --- Control de Volumen OSD (SwayOSD) ---
bindel = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
bindel = , XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bindl = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle

# --- Reglas de Ventanas Flotantes ---
windowrule = float 1, match:class blueman-manager
windowrule = float 1, match:class nm-connection-editor
windowrule = float 1, match:class polkit-kde-authentication-agent-1
windowrule = float 1, match:title Volume Control
windowrule = float 1, match:class pavucontrol
